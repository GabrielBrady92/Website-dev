<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" width="360" height="110">
  <defs>
    <linearGradient id="wg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ff3d00"/>
      <stop offset="20%"  stop-color="#ff7b00"/>
      <stop offset="40%"  stop-color="#ffd000"/>
      <stop offset="60%"  stop-color="#5bd650"/>
      <stop offset="80%"  stop-color="#00c8e0"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
  </defs>

  <!-- Wave path: smooth S-curve left to right -->
  <path d="M 8,55
    C 22,55 30,28 50,28
    C 70,28 78,62 98,56
    C 118,50 126,22 146,22
    C 166,22 172,56 192,54
    C 207,52 216,38 228,34"
    fill="none"
    stroke="url(#wg)"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Splash dots at wave tip -->
  <circle cx="234" cy="30" r="5"   fill="#00c8e0" opacity="0.9"/>
  <circle cx="244" cy="22" r="4"   fill="#0096ff" opacity="0.85"/>
  <circle cx="247" cy="38" r="3"   fill="#00e0ff" opacity="0.8"/>
  <circle cx="254" cy="14" r="2.5" fill="#0077ff" opacity="0.7"/>

  <!-- Pixel squares (top right) -->
  <rect x="264" y="6"  width="13" height="13" rx="2.5" fill="#22c55e"/>
  <rect x="280" y="6"  width="13" height="13" rx="2.5" fill="#eab308"/>
  <rect x="264" y="22" width="13" height="13" rx="2.5" fill="#3b82f6"/>
  <rect x="280" y="22" width="13" height="13" rx="2.5" fill="#0096ff"/>

  <!-- "Nexa" in orange, "Wave" in teal — bold, matching logo style -->
  <text x="6" y="97"
    font-family="'Inter','Arial Black',Arial,sans-serif"
    font-size="32"
    font-weight="900"
    letter-spacing="-0.5">
    <tspan fill="#ff6a00">Nexa</tspan><tspan fill="#00c8e0">Wave</tspan>
  </text>
</svg>

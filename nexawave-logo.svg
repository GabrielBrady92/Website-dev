<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ff4e00"/>
      <stop offset="25%"  stop-color="#f97316"/>
      <stop offset="50%"  stop-color="#84cc16"/>
      <stop offset="75%"  stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0096ff"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ff6a00"/>
      <stop offset="50%"  stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0096ff"/>
    </linearGradient>
  </defs>

  <!-- Wave ribbon shape -->
  <path d="M 10,52
    C 30,52 38,30 58,30
    C 78,30 88,58 108,52
    C 128,46 138,24 158,24
    C 178,24 185,52 205,52
    C 215,52 222,44 232,40"
    fill="none" stroke="url(#waveGrad)" stroke-width="9"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Splash dots at end of wave -->
  <circle cx="238" cy="36" r="4.5" fill="#22d3ee"/>
  <circle cx="248" cy="28" r="3.5" fill="#0096ff"/>
  <circle cx="252" cy="42" r="2.5" fill="#60a5fa"/>

  <!-- Pixel squares top right -->
  <rect x="262" y="10" width="11" height="11" rx="2" fill="#22c55e"/>
  <rect x="276" y="10" width="11" height="11" rx="2" fill="#eab308"/>
  <rect x="262" y="24" width="11" height="11" rx="2" fill="#3b82f6"/>
  <rect x="276" y="24" width="11" height="11" rx="2" fill="#0096ff"/>

  <!-- Logo text -->
  <text x="8" y="90" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="-1">
    <tspan fill="#ff6a00">Nexa</tspan><tspan fill="#22d3ee">Wave</tspan>
  </text>
</svg>
